<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- ================= PAGE SETTINGS ================= -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Deposit</title>

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>

<!-- ================= MAIN LAYOUT ================= -->
<div class="layout">


    <!-- =================================================
         SIDEBAR
    ================================================== -->
    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            ◈
            <span>SecureBank</span>
        </div>


        <!-- ================= NAVIGATION ================= -->
            <div th:insert="~{fragement/main.html}"></div>

        <!-- ================= SIDEBAR BOTTOM ================= -->
        <div th:insert="~{fragement/SideBarBottom.html}"></div>


    </aside>


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->
    <main class="content">


        <!-- ================= TOP BAR ================= -->
        <header class="topbar">

            <div>

                <h2>
                    Deposit Money
                </h2>

                <p class="muted">
                    Add funds to your SecureBank account.
                </p>

            </div>

        </header>


        <!-- =================================================
             DEPOSIT FORM CARD
        ================================================== -->
        <section class="form-card">


            <!-- Deposit Icon -->
            <div class="form-icon">
                ＋
            </div>


            <!-- Heading -->
            <h2>
                Make a Deposit
            </h2>


            <!-- Current Balance -->
            <p class="muted">
                Available balance:
                <b>₹50,000.00</b>
            </p>


            <!-- ================= DEPOSIT FORM ================= -->
            <form>


                <!-- Amount -->
                <label>
                    Amount
                </label>

                <div class="money">

                    <!-- Currency -->
                    <span>
                            ₹
                        </span>

                    <!-- Amount Input -->
                    <input
                            type="number"
                            min="1"
                            placeholder="0.00"
                            required
                    >

                </div>


                <!-- Payment Method -->
                <label>
                    Payment Method
                </label>

                <select>

                    <option>
                        Bank Transfer
                    </option>

                    <option>
                        UPI
                    </option>

                    <option>
                        Cash
                    </option>

                </select>


                <!-- Submit Button -->
                <button
                        type="submit"
                        class="btn">

                    Continue Deposit →

                </button>

            </form>

        </section>

    </main>

</div>


<!-- ================= JAVASCRIPT ================= -->
<script th:src="@{/js/app.js}"></script>

</body>

</html>
